name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Linux only: the tests need the dev Postgres, which runs in Docker.
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust with its WebAssembly target, tracey, uv, trunk, Hydra and the
      # Diesel CLI, as pinned in mise.toml.
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            items/py/target
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-

      # Formatting, clippy (native, WebAssembly and the Python binding) and
      # spec references.
      - name: Lint
        run: mise run lint

      # Starts the dev Postgres, then runs the Rust, Python and console tests.
      - name: Test
        run: mise run test

      - name: Stop Postgres
        if: always()
        run: mise run db:down

      # Builds the crates published to crates.io from their packaged sources,
      # as the release would, each against the others' packages.
      - name: Package the published crates
        run: |
          mapfile -t names < <(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | .name')
          cargo package --locked "${names[@]/#/-p}"
