name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Python binding is its own Cargo workspace, and maturin takes the
      # Python package's version from it, so both must match the tag.
      - name: Check tag and dependencies against Cargo.toml
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          with open("items/py/Cargo.toml", "rb") as manifest:
              py_version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ["TAG_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match the workspace version v{version}")
          if py_version != version:
              raise SystemExit(f"items/py/Cargo.toml has version {py_version}, not the workspace version {version}")
          # The published crates require each other at exactly this version.
          with open("Cargo.toml", "rb") as manifest:
              dependencies = tomllib.load(manifest)["workspace"]["dependencies"]
          stale = [
              f"{name} = {spec['version']!r}"
              for name, spec in dependencies.items()
              if name.startswith("konklav-") and isinstance(spec, dict) and "version" in spec and spec["version"] != f"={version}"
          ]
          if stale:
              raise SystemExit(f"Workspace dependencies on Konklav crates must require ={version}:\n" + "\n".join(stale))
          prerelease = "-" in version.split("+", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prerelease={str(prerelease).lower()}", file=output)
          PY

  ci:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04, so the binaries run with glibc 2.35 and OpenSSL 3
          # and later, such as on Debian 12 and Ubuntu 22.04.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Rust, as pinned in mise.toml, not the tests' tools.
      - name: Install Rust
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust

      # Restore only: a cache saved by a tag run is scoped to the tag, so no
      # other run could restore it.
      - name: Restore Cargo dependencies and build artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('mise.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            release-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --locked --release --bin konklav-server --target "$TARGET"

      - name: Smoke test release binary
        run: '"target/$TARGET/release/konklav-server" --version'

      - name: Package binary
        run: |
          archive="konklav-server-$TAG_NAME-$TARGET"
          mkdir -p "dist/$archive"
          cp "target/$TARGET/release/konklav-server" README.md LICENSE "dist/$archive/"
          tar -czf "dist/$archive.tar.gz" -C dist "$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  console:
    name: Build the console
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and trunk
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust github:trunk-rs/trunk

      # A static bundle, served by any web server in front of the control and
      # subject-facing surfaces.
      - name: Build and package
        run: |
          mise run console:build
          archive="konklav-console-$TAG_NAME"
          mkdir -p dist
          cp -R target/console/dist "dist/$archive"
          tar -czf "dist/$archive.tar.gz" -C dist "$archive"

      - name: Upload console archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-console
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  docker:
    name: Docker image
    needs: [validate, ci]
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  python:
    name: Python packages
    needs: [validate, ci]
    uses: ./.github/workflows/python.yml

  # Only once everything else has built, since a version published to PyPI
  # can never be uploaded again, even after deleting it.
  pypi:
    name: Publish to PyPI
    needs: [validate, build, console, docker, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Trusted publishing: PyPI accepts this workflow in this environment by
    # its OIDC token, so no API token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/konklav-relying/
    permissions:
      id-token: write
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # A re-run after a partial upload publishes the rest.
          skip-existing: true

  # Like PyPI, crates.io never accepts the same version twice, so this too
  # waits for everything else to build.
  crates:
    name: Publish to crates.io
    needs: [validate, build, console, docker, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Named in each crate's trusted publisher on crates.io.
    environment:
      name: crates-io
      url: https://crates.io/crates/konklav-relying
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust

      # A short-lived token from crates.io's trusted publishing, so no token
      # is stored.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Publishes the crates with `publish = true`, in dependency order,
      # skipping those already on crates.io at this version, so that a
      # failed release can be rerun. A crate's first version is published by
      # hand, as trusted publishing can only be set up for existing crates.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          packages=()
          while read -r name; do
            if curl -sf "https://index.crates.io/${name:0:2}/${name:2:2}/$name" | grep -qF "\"vers\":\"$version\""; then
              echo "$name $version is already published"
            else
              packages+=(-p "$name")
            fi
          done < <(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | .name')
          if (( ${#packages[@]} == 0 )); then
            echo "Every crate is already published"
          else
            cargo publish --locked "${packages[@]}"
          fi

  publish:
    name: Publish GitHub release
    needs: [validate, build, console, docker, pypi, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'konklav/konklav' }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease)
          fi
          notes="Docker image: \`$IMAGE:${TAG_NAME#v}\`, for linux/amd64 and linux/arm64. The Linux binaries need glibc 2.35 and OpenSSL 3 or later. Python package: [\`konklav-relying\`](https://pypi.org/project/konklav-relying/) on PyPI. Rust crates: [\`konklav-relying\`](https://crates.io/crates/konklav-relying), [\`konklav-relying-client\`](https://crates.io/crates/konklav-relying-client) and [\`konklav-authz\`](https://crates.io/crates/konklav-authz) on crates.io."
          gh release create "$TAG_NAME" dist/* \
            --verify-tag --generate-notes --notes "$notes" --title "$TAG_NAME" "${flags[@]}"
