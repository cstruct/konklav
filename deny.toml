# What `cargo deny check` allows of the dependencies, run in CI.

[graph]
all-features = true

[advisories]
# Every advisory fails the check, unmaintained crates included, until it's fixed or
# listed here with why it doesn't apply.
version = 2
ignore = [
  # A proc macro leptos uses, finished rather than abandoned, with no replacement upstream.
  { id = "RUSTSEC-2024-0436", reason = "paste is only used at compile time, through leptos" },
  # No release fixes it. Only openidconnect pulls rsa in, as a dev-dependency for the
  # tests against Hydra, which only verify signatures with it: no private-key operation.
  { id = "RUSTSEC-2023-0071", reason = "rsa is only in the Hydra tests, through openidconnect" },
  # A notice that chrono is no longer maintained, not a vulnerability, and no release
  # fixes it. Timestamps are chrono's throughout, and Diesel's and utoipa's chrono
  # support is what stores and documents them, so leaving it means moving those too.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained but not vulnerable; diesel and utoipa types need it" },
]

[licenses]
version = 2
# Permissive licenses, and MPL-2.0 (webauthn-rs), whose copyleft covers only
# the files of the crates themselves, not code that uses them.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates, by path.
allow-wildcard-paths = true

[sources]
# Only crates.io: no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
