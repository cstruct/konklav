[package]
name = "konklav-core"
description = "Identifiers and small value types shared across Konklav software items"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["generate"]
# Generating ids needs system randomness; verifiers (such as the relying
# core on wasm) only parse them.
generate = ["uuid/v7"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
