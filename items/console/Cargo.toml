[package]
name = "konklav-console"
description = "The Konklav console: a browser UI for operating the control plane"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.12"
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Crypto", "Window"] }

[lints]
workspace = true
