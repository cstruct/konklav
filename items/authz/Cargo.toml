[package]
name = "konklav-authz"
description = "Konklav authorization: entitlement compilation and decision evaluation, without I/O"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
repository.workspace = true

[features]
# OpenAPI schemas for the wire types, for the server's API document.
openapi = ["dep:utoipa", "konklav-core/openapi", "konklav-token/openapi"]

[dependencies]
konklav-core.workspace = true
konklav-token.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
konklav-core = { workspace = true, features = ["generate"] }
serde_json.workspace = true

[lints]
workspace = true
