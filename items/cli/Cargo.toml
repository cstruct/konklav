[package]
name = "konklav-cli"
description = "The Konklav operator CLI: browser or terminal sign-in to DPoP-bound sessions, and control-plane commands"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "konklav"
path = "src/main.rs"

[dependencies]
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dirs = "6.0.0"
facet.workspace = true
facet-styx.workspace = true
fd-lock = "4.0.4"
getrandom.workspace = true
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
konklav-token = { workspace = true, features = ["sign"] }
reqwest = { workspace = true, features = ["rustls"] }
rpassword = "7.4.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
