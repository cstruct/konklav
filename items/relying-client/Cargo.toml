[package]
name = "conclave-relying-client"
description = "Native Rust host binding for the relying core: HTTP, the change feed and background refresh on tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
conclave-authz.workspace = true
conclave-core.workspace = true
conclave-relying.workspace = true
conclave-token.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
conclave-authn.workspace = true
chrono.workspace = true
conclave-core = { workspace = true, features = ["generate"] }
conclave-server.workspace = true
conclave-store.workspace = true
conclave-test-support.workspace = true
ed25519-dalek.workspace = true
uuid = { workspace = true, features = ["v7"] }

[lints]
workspace = true
