[build-system]
requires = ["uv_build>=0.8.24,<0.9"]
build-backend = "uv_build"

[project]
name = "konklav-control-plane"
# Set by `mise run release:bump`, with the rest of the release.
version = "1.6.0"
description = "Manage Konklav from Python: tenants, subjects, credentials, roles and the rest of the control plane"
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cstruct/konklav"
Documentation = "https://github.com/cstruct/konklav/tree/main/items/py-control-plane"
Changelog = "https://github.com/cstruct/konklav/releases"
Issues = "https://github.com/cstruct/konklav/issues"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.88.0",
    "mypy==1.20.2",
    "pytest>=8",
    "unasync==0.6.0",
]

[tool.mypy]
files = ["src", "tools", "tests/typing"]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "unasync"
ignore_missing_imports = true
