[package]
name = "conclave-py"
description = "Python bindings for the Conclave relying core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
conclave-authz = { path = "../authz" }
conclave-core = { path = "../core", default-features = false }
conclave-relying = { path = "../relying" }
conclave-token = { path = "../token" }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
serde = "1.0.229"
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"

[workspace]
