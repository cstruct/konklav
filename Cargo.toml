[workspace]
members = [
    "examples",
    "items/api",
    "items/authn",
    "items/authz",
    "items/bootstrap",
    "items/console",
    "items/core",
    "items/relying",
    "items/relying-client",
    "items/server",
    "items/store",
    "items/test-support",
    "items/token",
]
resolver = "3"
# Built by maturin as a Python extension, with its own lockfile and target.
exclude = ["items/py"]

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/cstruct/konklav"
# Only the crates published to crates.io set `publish = true`.
publish = false

[workspace.dependencies]
# The crates published to crates.io require each other at exactly the release
# version, which `mise run release:bump` sets along with the workspace version.
konklav-api = { path = "items/api" }
konklav-authn = { path = "items/authn" }
konklav-authz = { version = "=1.4.0", path = "items/authz" }
konklav-bootstrap = { path = "items/bootstrap" }
konklav-console = { path = "items/console" }
konklav-core = { version = "=1.4.0", path = "items/core", default-features = false }
konklav-examples = { path = "examples" }
konklav-relying = { version = "=1.4.0", path = "items/relying" }
konklav-relying-client = { path = "items/relying-client" }
konklav-server = { path = "items/server" }
konklav-store = { path = "items/store" }
konklav-test-support = { path = "items/test-support" }
konklav-token = { version = "=1.4.0", path = "items/token" }

aes-gcm = "0.11.1"
aws-lc-rs = "1.18.2"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
diesel = { version = "2.3.14", default-features = false, features = ["postgres_backend", "uuid", "chrono", "serde_json", "32-column-tables"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper", "migrations"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
facet = { version = "0.46.5", features = ["net"] }
facet-reflect = "0.46"
facet-styx = "4.0"
facet-value = "0.46"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "aws-lc-rs"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
p256 = { version = "0.14.0", features = ["pkcs8", "pem"] }
ordna-core = "0.1.3"
ordna-source-env = "0.1.3"
ordna-source-file = "0.1.3"
ordna-source-styx = "0.1.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio-postgres = "0.7.18"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = "0.5.3"
# Passkeys. Links OpenSSL; only konklav-server may depend on it. State
# serialisation lets ceremony state live in challenge rows, and
# `conditional-ui` exposes discoverable (usernameless) authentication.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Telemetry over OTLP: traces, metrics and logs, over HTTP or gRPC.
opentelemetry = { version = "0.33.1", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-http = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "grpc-tonic", "logs", "metrics", "trace"] }
opentelemetry-proto = { version = "0.33.1", features = ["gen-tonic-messages", "logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.1", features = ["logs", "metrics", "trace"] }
prost = "0.14.4"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Pedantic style lints that fight readable domain names and early-return
# matches more than they help.
similar_names = "allow"
single_match_else = "allow"

# Password hashing and signatures are unbearably slow unoptimized, which
# would make debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
