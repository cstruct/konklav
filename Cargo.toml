[workspace]
members = [
    "items/authn",
    "items/authz",
    "items/core",
    "items/relying",
    "items/relying-client",
    "items/server",
    "items/store",
    "items/test-support",
    "items/token",
]
resolver = "3"
# Built by maturin as a Python extension, with its own lockfile and target.
exclude = ["items/py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
conclave-authn = { path = "items/authn" }
conclave-authz = { path = "items/authz" }
conclave-core = { path = "items/core", default-features = false }
conclave-relying = { path = "items/relying" }
conclave-relying-client = { path = "items/relying-client" }
conclave-server = { path = "items/server" }
conclave-store = { path = "items/store" }
conclave-test-support = { path = "items/test-support" }
conclave-token = { path = "items/token" }

argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
diesel = { version = "2.3.14", default-features = false, features = ["postgres_backend", "uuid", "chrono", "serde_json", "32-column-tables"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper", "migrations"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
facet = { version = "0.46.5", features = ["net"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
http-body-util = "0.1.5"
ordna-core = "0.1.3"
ordna-source-env = "0.1.3"
ordna-source-file = "0.1.3"
ordna-source-styx = "0.1.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio-postgres = "0.7.18"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Pedantic style lints that fight readable domain names and early-return
# matches more than they help.
similar_names = "allow"
single_match_else = "allow"

# Password hashing and signatures are unbearably slow unoptimized, which
# would make debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
