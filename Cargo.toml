[workspace]
members = ["items/core", "items/server", "items/store", "items/test-support"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
conclave-core = { path = "items/core" }
conclave-store = { path = "items/store" }
conclave-test-support = { path = "items/test-support" }

axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
diesel = { version = "2.3.14", default-features = false, features = ["postgres_backend", "uuid", "chrono", "serde_json"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper", "migrations"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
facet = { version = "0.46.5", features = ["net"] }
http-body-util = "0.1.5"
ordna-core = "0.1.3"
ordna-source-env = "0.1.3"
ordna-source-file = "0.1.3"
ordna-source-styx = "0.1.3"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
