<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 840 660" width="840" height="660" role="img" aria-labelledby="title desc">
  <title id="title">The dpop example</title>
  <desc id="desc">1: A browser app, a public client that must use DPoP, starts the code flow with dpop_jkt. 2: It exchanges the code with a proof from its key and gets DPoP tokens carrying cnf.jkt. 3: A relying system using the Rust relying client allows a request with the token and a fresh proof. 4: Replaying that request is refused. 5: The token sent as a bearer token is refused. 6: A refresh with another key&#x27;s proof is refused; with the app&#x27;s key it returns new DPoP tokens.</desc>
  <style>
    text{font-family:Inter,"Helvetica Neue",Arial,sans-serif;fill:#16161D}
    .bg{fill:#FBFAF7;stroke:#E4E0D8}
    .box{fill:#FFFFFF;stroke:#B9B5AD}
    .alt{fill:#F1EEE7;stroke:#D6D1C7}
    .key{fill:#FBEEEE;stroke:#B3202A}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#5E5B66}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
    .c{text-anchor:middle}
    .e{text-anchor:end}
    .cap{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#5E5B66}
    .ln{stroke:#6E6A75;stroke-width:1.5;fill:none}
    .lk{stroke:#B3202A;stroke-width:1.5;fill:none}
    .d{stroke-dasharray:5 4}
    .ah{fill:#6E6A75}.ak{fill:#B3202A}.acc{fill:#B3202A}
    @media (prefers-color-scheme:dark){
      text{fill:#F4F1EA}
      .bg{fill:#16161D;stroke:#2E2E38}
      .box{fill:#1F1F28;stroke:#4A4954}
      .alt{fill:#24242D;stroke:#3A3944}
      .key{fill:#331A1E;stroke:#E0454E}
      .s,.cap{fill:#A8A49C}
      .ln{stroke:#A8A49C}.lk{stroke:#E0454E}
      .ah{fill:#A8A49C}.ak{fill:#E0454E}.acc{fill:#E0454E}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 1L10 5L0 9z"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ak" d="M0 1L10 5L0 9z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="839" height="659" rx="12"/>

  <!-- participants -->
  <rect class="box" x="60" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="130.0" y="47.0">Browser app</text>
  <text class="s c" x="130.0" y="64.0">non-extractable key</text>
  <rect class="key" x="350" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="420.0" y="47.0">Konklav</text>
  <text class="s c" x="420.0" y="64.0">OpenID provider</text>
  <rect class="box" x="630" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="700.0" y="47.0">Relying system</text>
  <text class="s c" x="700.0" y="64.0">Rust relying client</text>
  <path class="ln d" d="M130 76V640" opacity=".5"/>
  <path class="ln d" d="M420 76V640" opacity=".5"/>
  <path class="ln d" d="M700 76V640" opacity=".5"/>
  <circle class="key" cx="26" cy="118" r="11"/><text class="h c acc" x="26" y="123">1</text>
  <circle class="key" cx="26" cy="200" r="11"/><text class="h c acc" x="26" y="205">2</text>
  <circle class="key" cx="26" cy="302" r="11"/><text class="h c acc" x="26" y="307">3</text>
  <circle class="key" cx="26" cy="380" r="11"/><text class="h c acc" x="26" y="385">4</text>
  <circle class="key" cx="26" cy="458" r="11"/><text class="h c acc" x="26" y="463">5</text>
  <circle class="key" cx="26" cy="540" r="11"/><text class="h c acc" x="26" y="545">6</text>
  <path class="ln" d="M130 114H418" marker-end="url(#a)"/>
  <text class="s c" x="275.0" y="107">authorize with dpop_jkt</text>
  <path class="ln d" d="M420 148H132" marker-end="url(#a)"/>
  <text class="s c" x="275.0" y="141">code, bound to the key</text>
  <path class="ln" d="M130 196H418" marker-end="url(#a)"/>
  <text class="m c" x="275.0" y="189">POST /v1/oauth2/token</text>
  <text class="s c" x="275.0" y="212">with a proof (without one: invalid_dpop_proof)</text>
  <path class="ln d" d="M420 244H132" marker-end="url(#a)"/>
  <text class="s c" x="275.0" y="237">token_type DPoP, cnf.jkt</text>
  <path class="lk" d="M130 298H698" marker-end="url(#k)"/>
  <text class="s c" x="560" y="291">DPoP token + fresh proof</text>
  <path class="ln d" d="M700 332H132" marker-end="url(#a)"/>
  <text class="s c" x="560" y="325">allow</text>
  <path class="ln" d="M130 376H698" marker-end="url(#a)"/>
  <text class="s c" x="560" y="369">the same request again</text>
  <path class="ln d" d="M700 410H132" marker-end="url(#a)"/>
  <text class="s c" x="560" y="403">deny: invalid_dpop_proof</text>
  <path class="ln" d="M130 454H698" marker-end="url(#a)"/>
  <text class="s c" x="560" y="447">Bearer token, no proof</text>
  <path class="ln d" d="M700 488H132" marker-end="url(#a)"/>
  <text class="s c" x="560" y="481">deny: invalid_dpop_proof</text>
  <path class="ln" d="M130 536H418" marker-end="url(#a)"/>
  <text class="s c" x="275.0" y="529">refresh with another key&#x27;s proof</text>
  <path class="ln d" d="M420 570H132" marker-end="url(#a)"/>
  <text class="s c" x="275.0" y="563">400, session unchanged</text>
  <path class="ln" d="M130 610H418" marker-end="url(#a)"/>
  <text class="s c" x="275.0" y="603">refresh with the app&#x27;s key</text>
  <path class="ln d" d="M420 640H132" marker-end="url(#a)"/>
  <text class="s c" x="275.0" y="633">new DPoP tokens</text>
</svg>
