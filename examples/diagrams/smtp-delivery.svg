<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 840 540" width="840" height="540" role="img" aria-labelledby="title desc">
  <title id="title">The smtp-delivery example</title>
  <desc id="desc">1: The app asks Konklav for an email link. 2: Konklav emits delivery.requested on its change feed, which the delivery worker follows as a service principal holding konklav.delivery. 3: The worker sends the link by SMTP. 4: The person follows the link to the app. 5: The app completes the sign-in with the link&#x27;s token and gets an access token. 6: The same token is refused a second time.</desc>
  <style>
    text{font-family:Inter,"Helvetica Neue",Arial,sans-serif;fill:#16161D}
    .bg{fill:#FBFAF7;stroke:#E4E0D8}
    .box{fill:#FFFFFF;stroke:#B9B5AD}
    .alt{fill:#F1EEE7;stroke:#D6D1C7}
    .key{fill:#FBEEEE;stroke:#B3202A}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#5E5B66}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
    .c{text-anchor:middle}
    .e{text-anchor:end}
    .cap{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#5E5B66}
    .ln{stroke:#6E6A75;stroke-width:1.5;fill:none}
    .lk{stroke:#B3202A;stroke-width:1.5;fill:none}
    .d{stroke-dasharray:5 4}
    .ah{fill:#6E6A75}.ak{fill:#B3202A}.acc{fill:#B3202A}
    @media (prefers-color-scheme:dark){
      text{fill:#F4F1EA}
      .bg{fill:#16161D;stroke:#2E2E38}
      .box{fill:#1F1F28;stroke:#4A4954}
      .alt{fill:#24242D;stroke:#3A3944}
      .key{fill:#331A1E;stroke:#E0454E}
      .s,.cap{fill:#A8A49C}
      .ln{stroke:#A8A49C}.lk{stroke:#E0454E}
      .ah{fill:#A8A49C}.ak{fill:#E0454E}.acc{fill:#E0454E}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 1L10 5L0 9z"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ak" d="M0 1L10 5L0 9z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="839" height="539" rx="12"/>

  <!-- participants -->
  <rect class="box" x="40" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="110.0" y="47.0">App</text>
  <text class="s c" x="110.0" y="64.0">app.example</text>
  <rect class="key" x="250" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="320.0" y="47.0">Konklav</text>
  <text class="s c" x="320.0" y="64.0">subject, relying</text>
  <rect class="box" x="460" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="530.0" y="47.0">Delivery worker</text>
  <text class="s c" x="530.0" y="64.0">konklav.delivery</text>
  <rect class="box" x="670" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="740.0" y="47.0">SMTP, inbox</text>
  <text class="s c" x="740.0" y="64.0">the person&#x27;s mail</text>
  <path class="ln d" d="M110 76V520" opacity=".5"/>
  <path class="ln d" d="M320 76V520" opacity=".5"/>
  <path class="ln d" d="M530 76V520" opacity=".5"/>
  <path class="ln d" d="M740 76V520" opacity=".5"/>
  <circle class="key" cx="26" cy="118" r="11"/><text class="h c acc" x="26" y="123">1</text>
  <circle class="key" cx="26" cy="204" r="11"/><text class="h c acc" x="26" y="209">2</text>
  <circle class="key" cx="26" cy="256" r="11"/><text class="h c acc" x="26" y="261">3</text>
  <circle class="key" cx="26" cy="308" r="11"/><text class="h c acc" x="26" y="313">4</text>
  <circle class="key" cx="26" cy="360" r="11"/><text class="h c acc" x="26" y="365">5</text>
  <circle class="key" cx="26" cy="460" r="11"/><text class="h c acc" x="26" y="465">6</text>
  <path class="ln" d="M110 114H318" marker-end="url(#a)"/>
  <text class="m c" x="215.0" y="107">POST …/email-link/start</text>
  <path class="ln d" d="M320 148H112" marker-end="url(#a)"/>
  <text class="s c" x="215.0" y="141">202 Accepted</text>
  <path class="ln d" d="M320 200H528" marker-end="url(#a)"/>
  <text class="s c" x="425.0" y="193">delivery.requested, on the feed</text>
  <path class="ln" d="M530 252H738" marker-end="url(#a)"/>
  <text class="s c" x="635.0" y="245">email with a sign-in link</text>
  <path class="ln" d="M740 304H112" marker-end="url(#a)"/>
  <text class="s c" x="425" y="297">the person follows /email-link?token=…</text>
  <path class="ln" d="M110 356H318" marker-end="url(#a)"/>
  <text class="m c" x="215.0" y="349">POST …/email-link/complete</text>
  <text class="s c" x="215.0" y="372">the link&#x27;s token</text>
  <path class="ln d" d="M320 404H112" marker-end="url(#a)"/>
  <text class="s c" x="215.0" y="397">access token: signed in</text>
  <path class="ln" d="M110 456H318" marker-end="url(#a)"/>
  <text class="s c" x="215.0" y="449">the same token again</text>
  <path class="ln d" d="M320 490H112" marker-end="url(#a)"/>
  <text class="s c" x="215.0" y="483">401: a link works once</text>
</svg>
