<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 840 650" width="840" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Signing in to the app with single sign-on and DPoP</title>
  <desc id="desc">1: The app page sends the browser to Konklav&#x27;s authorization endpoint with PKCE and dpop_jkt, its key&#x27;s thumbprint; Konklav hands it to the login page with login_request. 2: The login page refreshes its own Konklav session from the HttpOnly cookie with a DPoP proof, or signs in with a password if there is none. 3: It accepts the request with its DPoP-bound token and gets redirect_to. 4: The browser follows redirect_to, and Konklav redirects to the app with a code. 5: The app exchanges the code with a DPoP proof and gets DPoP tokens bound to its key. 6: It calls its backend with the token and a fresh proof, and the relying client decides.</desc>
  <style>
    text{font-family:Inter,"Helvetica Neue",Arial,sans-serif;fill:#16161D}
    .bg{fill:#FBFAF7;stroke:#E4E0D8}
    .box{fill:#FFFFFF;stroke:#B9B5AD}
    .alt{fill:#F1EEE7;stroke:#D6D1C7}
    .key{fill:#FBEEEE;stroke:#B3202A}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#5E5B66}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
    .c{text-anchor:middle}
    .e{text-anchor:end}
    .cap{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#5E5B66}
    .ln{stroke:#6E6A75;stroke-width:1.5;fill:none}
    .lk{stroke:#B3202A;stroke-width:1.5;fill:none}
    .d{stroke-dasharray:5 4}
    .ah{fill:#6E6A75}.ak{fill:#B3202A}.acc{fill:#B3202A}
    @media (prefers-color-scheme:dark){
      text{fill:#F4F1EA}
      .bg{fill:#16161D;stroke:#2E2E38}
      .box{fill:#1F1F28;stroke:#4A4954}
      .alt{fill:#24242D;stroke:#3A3944}
      .key{fill:#331A1E;stroke:#E0454E}
      .s,.cap{fill:#A8A49C}
      .ln{stroke:#A8A49C}.lk{stroke:#E0454E}
      .ah{fill:#A8A49C}.ak{fill:#E0454E}.acc{fill:#E0454E}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 1L10 5L0 9z"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ak" d="M0 1L10 5L0 9z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="839" height="649" rx="12"/>

  <!-- participants -->
  <rect class="box" x="40" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="110.0" y="47.0">App page</text>
  <text class="s c" x="110.0" y="64.0">localhost:3000</text>
  <rect class="key" x="260" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="330.0" y="47.0">Konklav</text>
  <text class="s c" x="330.0" y="64.0">via localhost:8000</text>
  <rect class="box" x="480" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="550.0" y="47.0">Login page</text>
  <text class="s c" x="550.0" y="64.0">localhost:8000</text>
  <rect class="box" x="680" y="24" width="140" height="52" rx="8"/>
  <text class="h c" x="750.0" y="47.0">App backend</text>
  <text class="s c" x="750.0" y="64.0">localhost:3001</text>
  <path class="ln d" d="M110 76V630" opacity=".5"/>
  <path class="ln d" d="M330 76V630" opacity=".5"/>
  <path class="ln d" d="M550 76V630" opacity=".5"/>
  <path class="ln d" d="M750 76V630" opacity=".5"/>

  <!-- step numbers -->
  <circle class="key" cx="26" cy="114" r="11"/><text class="h c acc" x="26" y="119">1</text>
  <circle class="key" cx="26" cy="200" r="11"/><text class="h c acc" x="26" y="205">2</text>
  <circle class="key" cx="26" cy="294" r="11"/><text class="h c acc" x="26" y="299">3</text>
  <circle class="key" cx="26" cy="374" r="11"/><text class="h c acc" x="26" y="379">4</text>
  <circle class="key" cx="26" cy="460" r="11"/><text class="h c acc" x="26" y="465">5</text>
  <circle class="key" cx="26" cy="570" r="11"/><text class="h c acc" x="26" y="575">6</text>

  <!-- 1 -->
  <path class="ln" d="M110 114H328" marker-end="url(#a)"/>
  <text class="s c" x="220.0" y="107">authorize: PKCE, dpop_jkt</text>
  <path class="ln d" d="M330 148H548" marker-end="url(#a)"/>
  <text class="s c" x="440.0" y="141">redirect with login_request</text>

  <!-- 2 -->
  <path class="ln" d="M550 200H332" marker-end="url(#a)"/>
  <text class="m c" x="440.0" y="193">POST /v1/refresh</text>
  <text class="s c" x="440.0" y="216">cookie and proof, or a password login</text>
  <path class="ln d" d="M330 248H548" marker-end="url(#a)"/>
  <text class="s c" x="440.0" y="241">access token bound to the page&#x27;s key</text>

  <!-- 3 -->
  <path class="ln" d="M550 294H332" marker-end="url(#a)"/>
  <text class="m c" x="440.0" y="287">POST …/accept, DPoP token</text>
  <path class="ln d" d="M330 328H548" marker-end="url(#a)"/>
  <text class="s c" x="440.0" y="321">redirect_to</text>

  <!-- 4 -->
  <path class="ln" d="M550 374H332" marker-end="url(#a)"/>
  <text class="s c" x="440.0" y="367">follow redirect_to</text>
  <path class="ln d" d="M330 408H112" marker-end="url(#a)"/>
  <text class="s c" x="220.0" y="401">redirect: code, state, iss</text>

  <!-- 5 -->
  <path class="ln" d="M110 460H328" marker-end="url(#a)"/>
  <text class="m c" x="220.0" y="453">POST /v1/oauth2/token</text>
  <text class="s c" x="220.0" y="476">code, verifier, DPoP proof</text>
  <path class="ln d" d="M330 508H112" marker-end="url(#a)"/>
  <text class="s c" x="220.0" y="501">DPoP tokens, cnf.jkt</text>

  <!-- 6 -->
  <path class="lk" d="M110 570H748" marker-end="url(#k)"/>
  <text class="s c" x="430" y="563">GET /api/notes: DPoP token + proof for this request</text>
  <path class="ln d" d="M750 610H112" marker-end="url(#a)"/>
  <text class="s c" x="430" y="603">decided from the change feed</text>
</svg>
