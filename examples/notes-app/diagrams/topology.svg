<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 840 480" width="840" height="480" role="img" aria-labelledby="title desc">
  <title id="title">The single sign-on example&#x27;s services</title>
  <desc id="desc">In the browser: the login page on localhost:8000, the app page on localhost:3000 and the admin page on localhost:4000. The login page talks to the sso service, which serves it and proxies Konklav&#x27;s subject-facing surface. The app page loads from app-frontend, gets tokens from Konklav through the sso origin, and calls app-backend with a DPoP token and proof. The admin page talks only to the admin service with a session cookie. On the Compose network, app-backend and admin follow Konklav&#x27;s relying surface, admin uses the subject-facing surface for tokens and the control plane for people and roles. Konklav&#x27;s surfaces are not published.</desc>
  <style>
    text{font-family:Inter,"Helvetica Neue",Arial,sans-serif;fill:#16161D}
    .bg{fill:#FBFAF7;stroke:#E4E0D8}
    .box{fill:#FFFFFF;stroke:#B9B5AD}
    .alt{fill:#F1EEE7;stroke:#D6D1C7}
    .key{fill:#FBEEEE;stroke:#B3202A}
    .h{font-size:14px;font-weight:600}
    .s{font-size:12px;fill:#5E5B66}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
    .c{text-anchor:middle}
    .e{text-anchor:end}
    .cap{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#5E5B66}
    .ln{stroke:#6E6A75;stroke-width:1.5;fill:none}
    .lk{stroke:#B3202A;stroke-width:1.5;fill:none}
    .d{stroke-dasharray:5 4}
    .ah{fill:#6E6A75}.ak{fill:#B3202A}.acc{fill:#B3202A}
    @media (prefers-color-scheme:dark){
      text{fill:#F4F1EA}
      .bg{fill:#16161D;stroke:#2E2E38}
      .box{fill:#1F1F28;stroke:#4A4954}
      .alt{fill:#24242D;stroke:#3A3944}
      .key{fill:#331A1E;stroke:#E0454E}
      .s,.cap{fill:#A8A49C}
      .ln{stroke:#A8A49C}.lk{stroke:#E0454E}
      .ah{fill:#A8A49C}.ak{fill:#E0454E}.acc{fill:#E0454E}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 1L10 5L0 9z"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ak" d="M0 1L10 5L0 9z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="839" height="479" rx="12"/>

  <!-- browser -->
  <rect class="alt" x="20" y="24" width="800" height="116" rx="10"/>
  <text class="cap" x="36" y="44">BROWSER</text>
  <rect class="box" x="40" y="60" width="175" height="60" rx="8"/>
  <text class="h c" x="127.5" y="87.0">Login page</text>
  <text class="s c" x="127.5" y="104.0">localhost:8000</text>
  <rect class="box" x="235" y="60" width="370" height="60" rx="8"/>
  <text class="h c" x="420.0" y="87.0">App page</text>
  <text class="s c" x="420.0" y="104.0">localhost:3000</text>
  <rect class="box" x="625" y="60" width="175" height="60" rx="8"/>
  <text class="h c" x="712.5" y="87.0">Admin page</text>
  <text class="s c" x="712.5" y="104.0">localhost:4000</text>

  <!-- compose network -->
  <rect class="alt" x="20" y="180" width="800" height="280" rx="10"/>
  <text class="cap" x="36" y="200">COMPOSE NETWORK</text>
  <rect class="box" x="40" y="214" width="175" height="56" rx="8"/>
  <text class="h c" x="127.5" y="239.0">sso</text>
  <text class="s c" x="127.5" y="256.0">login page, /v1 proxy</text>
  <rect class="box" x="235" y="214" width="175" height="56" rx="8"/>
  <text class="h c" x="322.5" y="239.0">app-frontend</text>
  <text class="s c" x="322.5" y="256.0">page and script</text>
  <rect class="box" x="430" y="214" width="175" height="56" rx="8"/>
  <text class="h c" x="517.5" y="239.0">app-backend</text>
  <text class="s c" x="517.5" y="256.0">relying system</text>
  <rect class="box" x="625" y="214" width="175" height="56" rx="8"/>
  <text class="h c" x="712.5" y="239.0">admin</text>
  <text class="s c" x="712.5" y="256.0">page, backend</text>
  <rect class="key" x="40" y="352" width="760" height="92" rx="10"/>
  <text class="cap" x="56" y="372">KONKLAV (NOT PUBLISHED)</text>
  <rect class="box" x="60" y="382" width="220" height="50" rx="8"/>
  <text class="h c" x="170.0" y="404.0">subject-facing</text>
  <text class="s c" x="170.0" y="421.0">:8080</text>
  <rect class="box" x="310" y="382" width="220" height="50" rx="8"/>
  <text class="h c" x="420.0" y="404.0">relying</text>
  <text class="s c" x="420.0" y="421.0">:8081</text>
  <rect class="box" x="560" y="382" width="220" height="50" rx="8"/>
  <text class="h c" x="670.0" y="404.0">control plane</text>
  <text class="s c" x="670.0" y="421.0">:8082</text>

  <!-- browser to services -->
  <path class="ln" d="M127 120V212" marker-end="url(#a)"/>
  <text class="s e" x="120" y="156">/v1 with proofs,</text>
  <text class="s e" x="120" y="172">refresh cookie</text>
  <path class="ln" d="M255 120L203 212" marker-end="url(#a)"/>
  <text class="s e" x="238" y="164">token, userinfo</text>
  <path class="ln" d="M322 120V212" marker-end="url(#a)"/>
  <text class="s" x="330" y="164">page, script</text>
  <path class="lk" d="M517 120V212" marker-end="url(#k)"/>
  <text class="s" x="525" y="164">DPoP token + fresh proof</text>
  <path class="ln" d="M712 120V212" marker-end="url(#a)"/>
  <text class="s" x="720" y="164">session cookie only</text>

  <!-- services to Konklav -->
  <path class="ln" d="M127 270V380" marker-end="url(#a)"/>
  <text class="s" x="135" y="330">proxied</text>
  <path class="ln" d="M480 270V380" marker-end="url(#a)"/>
  <text class="s e" x="472" y="346">keys, feed</text>
  <path class="ln d" d="M645 270V300H250V380" marker-end="url(#a)"/>
  <text class="s c" x="450" y="294">token, userinfo (server side)</text>
  <path class="ln" d="M700 270V322H515V380" marker-end="url(#a)"/>
  <text class="s c" x="608" y="316">keys, feed</text>
  <path class="ln" d="M760 270V380" marker-end="url(#a)"/>
  <text class="s e" x="752" y="346">people, roles</text>
</svg>
