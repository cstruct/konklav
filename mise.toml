[tools]
# The Rust toolchain, installed through rustup, with the WebAssembly target
# the console and the relying core build for.
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-analyzer,rust-src", targets = "wasm32-unknown-unknown" }
# Lints the GitHub Actions workflows.
"github:rhysd/actionlint" = "1.7.7"
# Checks the dependencies for security advisories, licenses and sources, see deny.toml.
"github:EmbarkStudios/cargo-deny" = "0.19.9"
# Tracks the spec in docs/spec against the code, from its GitHub releases.
"github:bearcove/tracey" = "1.4.0"
# Diesel's CLI for migrations and schema.rs. libpq is compiled in, so no
# system Postgres client libraries are needed.
# Builds and tests the Python relying binding (items/py).
uv = "0.8.24"
# An independent OpenID provider for integration tests of Konklav as an
# identity-provider client. Runs in memory; see the `hydra` task.
# The SQLite builds, which run in memory (`DSN=memory`).
"github:ory/hydra" = { version = "25.4.0", platforms = { macos-arm64 = { asset_pattern = "hydra_*-macOS_sqlite_arm64.tar.gz" }, macos-x64 = { asset_pattern = "hydra_*-macOS_sqlite_64bit.tar.gz" }, linux-x64 = { asset_pattern = "hydra_*-linux_sqlite_64bit.tar.gz" }, linux-arm64 = { asset_pattern = "hydra_*-linux_sqlite_arm64.tar.gz" } } }
# Builds and serves the console (items/console) as a WASM app; fetches the
# matching wasm-bindgen CLI by itself.
"github:trunk-rs/trunk" = "0.21.14"
"cargo:diesel_cli" = { version = "2.3.14", default-features = false, features = "postgres-bundled" }

[env]
# Below the ephemeral port ranges (32768+ on Linux, 49152+ on macOS), so an
# outgoing connection can never be holding it when Postgres starts.
KONKLAV_DEV_PG_PORT = "15432"
DATABASE_URL = "postgres://konklav:konklav@localhost:{{env.KONKLAV_DEV_PG_PORT}}/konklav"
KONKLAV_CONFIG = "{{config_root}}/config/dev.styx"
KONKLAV_SECRETS = "{{config_root}}/config/dev.secrets.styx"

[tasks."db:up"]
description = "Start the local Postgres and wait until it accepts connections"
run = "docker compose -f dev/compose.yaml up -d --wait --build"

[tasks."db:down"]
description = "Stop the local Postgres, keeping its data"
run = "docker compose -f dev/compose.yaml down"

[tasks."db:reset"]
description = "Stop the local Postgres and delete its data"
run = "docker compose -f dev/compose.yaml down --volumes"

[tasks."db:status"]
description = "Show the status of the local Postgres"
run = "docker compose -f dev/compose.yaml ps"

[tasks."db:logs"]
description = "Follow logs from the local Postgres"
run = "docker compose -f dev/compose.yaml logs --follow"

[tasks."db:psql"]
description = "Open psql against the local database"
run = "docker compose -f dev/compose.yaml exec postgres psql -U konklav -d konklav"

[tasks.build]
description = "Build every crate"
run = "cargo build --workspace"

[tasks.test]
description = "Run every test; database tests use isolated databases on the local Postgres"
depends = ["db:up", "py:test", "py-control-plane:test", "py-control-plane:integration", "example:python", "console:smoke"]
run = "cargo test --workspace"

[tasks.deny]
description = "Check the dependencies for security advisories, licenses and sources"
run = "cargo deny --locked check"

[tasks."py:test"]
description = "Build the Python relying binding and run its tests"
dir = "items/py"
# --refresh-package rebuilds the Rust extension: uv's build cache only
# notices changes to pyproject.toml, not to the Rust sources.
run = ["uv sync -q --refresh-package konklav-relying --reinstall-package konklav-relying", "uv run -q pytest -q tests"]

[tasks."py:build"]
description = "Build the Python relying binding's sdist and a release wheel for this machine into items/py/dist"
dir = "items/py"
run = ["rm -rf dist", "uv build -q --out-dir dist"]

[tasks."py-control-plane:test"]
description = "Run the Python control-plane client's unit tests"
dir = "items/py-control-plane"
run = ["uv sync -q --locked", "uv run -q pytest -q tests --ignore=tests/integration"]

[tasks."py-control-plane:integration"]
description = "Run the Python control-plane client's integration tests against servers on fresh databases"
depends = ["db:up"]
dir = "items/py-control-plane"
env = { KONKLAV_TEST_SERVER = "{{config_root}}/target/debug/test-server" }
run = [
    # test-server starts the konklav-server binary next to it.
    "cargo build -q -p konklav-server --bin konklav-server -p konklav-examples --bin test-server",
    "uv sync -q --locked",
    "uv run -q pytest -q tests/integration",
]

[tasks."py-control-plane:generate"]
description = "Regenerate the Python control-plane client's types from the API document, and its sync client and tests from the async ones"
dir = "items/py-control-plane"
run = "uv run -q --locked python tools/generate.py"

[tasks."py-control-plane:build"]
description = "Build the Python control-plane client's sdist and wheel into items/py-control-plane/dist"
dir = "items/py-control-plane"
run = ["rm -rf dist", "uv build -q --out-dir dist"]

[tasks."example:python"]
description = "Run the Python examples in examples/python against servers on fresh databases"
depends = ["db:up"]
dir = "examples/python"
env = { KONKLAV_TEST_SERVER = "{{config_root}}/target/debug/test-server" }
run = [
    # test-server starts the konklav-server binary next to it.
    "cargo build -q -p konklav-server --bin konklav-server -p konklav-examples --bin test-server",
    # --refresh-package rebuilds the Rust extension, as in py:test.
    "uv sync -q --locked --refresh-package konklav-relying --reinstall-package konklav-relying --reinstall-package konklav-control-plane",
    "uv run -q pytest -q tests",
]

[tasks."release:bump"]
description = "Set the release version everywhere it is recorded, and commit it on the current branch, or from main on a release branch with a pull request of its own"
usage = 'arg "<version>" help="The new version, such as 1.3.0 or 1.3.0-rc.1"'
run = """
set -eu
version=${usage_version?}
echo "$version" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Not a version: $version" >&2; exit 1; }
# The release commit should hold only the bump.
test -z "$(git status --porcelain)" || { echo "The working tree has uncommitted changes" >&2; git status --short >&2; exit 1; }
current=$(git branch --show-current)
test -n "$current" || { echo "Not on a branch" >&2; exit 1; }
# main takes changes only through pull requests, so on main the bump goes on a
# branch and pull request of its own. On any other branch it is committed
# there, to be merged with the rest of that branch's pull request.
if test "$current" = main; then
  git pull -q --ff-only
  branch=release/v$version
  git switch -q -c "$branch"
fi
# The workspace version, the Python binding's, which maturin also uses for
# the Python package, and the Python control-plane client's.
for manifest in Cargo.toml items/py/Cargo.toml items/py-control-plane/pyproject.toml; do
  test "$(grep -c '^version = ' "$manifest")" = 1
  perl -pi -e "s/^version = \\"[^\\"]*\\"/version = \\"$version\\"/" "$manifest"
done
# The published crates' requirements on each other.
perl -pi -e "s/^(konklav-[a-z-]+ = \\{ version = \\")=[^\\"]*/\\1=$version/" Cargo.toml
cargo update -q --workspace
cargo update -q --workspace --manifest-path items/py/Cargo.toml
(cd items/py-control-plane && uv lock -q)
(cd examples/python && uv lock -q)
# The API document records the version too; its test rewrites it.
KONKLAV_UPDATE_OPENAPI=1 cargo test -q -p konklav-server --lib openapi::tests::committed_document_is_current
git commit -q -am "Release $version"
if test "$current" = main; then
  git push -q -u origin "$branch"
  gh pr create --base main --head "$branch" --title "Release $version" \\
    --body "Sets the version to $version. Once this is merged, run mise run release:tag on main to tag it, which starts the release."
  git switch -q main
fi
"""

[tasks."release:tag"]
description = "Tag main's merged release commit with its version and push the tag, which starts the release"
run = """
set -eu
test -z "$(git status --porcelain)" || { echo "The working tree has uncommitted changes" >&2; git status --short >&2; exit 1; }
test "$(git branch --show-current)" = main || { echo "Not on main" >&2; exit 1; }
git pull -q --ff-only
version=$(perl -ne 'print $1 if /^version = "(.*)"$/' Cargo.toml)
# Until the release pull request is merged, main still has the last release's
# version, which is already tagged.
if git ls-remote -q --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
  echo "v$version is already tagged; merge the release pull request first" >&2
  exit 1
fi
git tag -a "v$version" -m "Konklav $version"
git push origin "v$version"
"""

[tasks.lint]
description = "Check formatting, lints, dependencies, spec traceability and the CI workflows"
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
    "cargo build -q -p konklav-relying --target wasm32-unknown-unknown",
    "cargo clippy -q -p konklav-console --target wasm32-unknown-unknown -- -D warnings",
    "cargo fmt --manifest-path items/py/Cargo.toml --check",
    "PYO3_PYTHON=$(cd items/py && uv python find) cargo clippy --manifest-path items/py/Cargo.toml -- -D warnings",
    "cd items/py-control-plane && uv run -q --locked python tools/generate.py --check",
    "cd items/py-control-plane && uv run -q --locked mypy",
    "cargo deny --locked check",
    "actionlint",
    "tracey query validate",
]

[tasks."console:serve"]
description = "Serve the console on http://127.0.0.1:8083, proxying to `mise run serve`"
dir = "items/console"
run = "trunk serve"

[tasks."console:build"]
description = "Build the console for release into target/console/dist"
dir = "items/console"
run = "trunk build --release"

[tasks."console:smoke"]
description = "Build the console with trunk and check the bundle it produces"
dir = "items/console"
run = """
trunk build --dist ../../target/console/smoke
test -s ../../target/console/smoke/index.html
grep -q 'konklav-console' ../../target/console/smoke/index.html
ls ../../target/console/smoke/*.wasm >/dev/null
"""

[tasks.migrate]
description = "Apply pending migrations to the local database"
depends = ["db:up"]
run = "cargo run -q -p konklav-server -- migrate"

[tasks.hydra]
description = "Run Ory Hydra in memory (public :4444, admin :4445) to try identity-provider logins by hand"
run = "hydra serve all --dev"

[tasks.hydra.env]
DSN = "memory"
URLS_SELF_ISSUER = "http://127.0.0.1:4444"
URLS_LOGIN = "http://127.0.0.1:3000/login"
URLS_CONSENT = "http://127.0.0.1:3000/consent"
SECRETS_SYSTEM = "konklav-dev-only-hydra-system-secret"

[tasks."dev:signing-key"]
description = "Create the untracked development signing key if it is missing"
run = "test -f config/dev.signing-key.pem || openssl genpkey -algorithm Ed25519 -out config/dev.signing-key.pem"

[tasks.serve]
description = "Run the server against the local database with config/dev.styx"
depends = ["migrate", "dev:signing-key"]
run = "cargo run -q -p konklav-server -- serve"

[tasks."db:schema"]
description = "Regenerate items/store/src/schema.rs from the migrations"
depends = ["db:up"]
dir = "items/store"
run = "diesel migration run && diesel print-schema > src/schema.rs"

[tasks.example]
description = "Run an example from examples/: smtp-delivery, federation or bootstrap"
depends = ["db:up"]
usage = 'arg "<name>" help="The example to run"'
run = "cargo build -q -p konklav-server && cargo run -q -p konklav-examples --bin ${usage_name?}"
