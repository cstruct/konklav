[tools]
# The Rust toolchain, installed through rustup.
rust = { version = "1.99.0", components = "rustfmt,clippy" }
# Tracks the spec in docs/spec against the code, from its GitHub releases.
"github:bearcove/tracey" = "1.4.0"
# Diesel's CLI for migrations and schema.rs. libpq is compiled in, so no
# system Postgres client libraries are needed.
"cargo:diesel_cli" = { version = "2.3.14", default-features = false, features = "postgres-bundled" }

[env]
CONCLAVE_DEV_PG_PORT = "55432"
DATABASE_URL = "postgres://conclave:conclave@localhost:{{env.CONCLAVE_DEV_PG_PORT}}/conclave"

[tasks."db:up"]
description = "Start the local Postgres and wait until it accepts connections"
run = "docker compose -f dev/compose.yaml up -d --wait"

[tasks."db:down"]
description = "Stop the local Postgres, keeping its data"
run = "docker compose -f dev/compose.yaml down"

[tasks."db:reset"]
description = "Stop the local Postgres and delete its data"
run = "docker compose -f dev/compose.yaml down --volumes"

[tasks."db:status"]
description = "Show the status of the local Postgres"
run = "docker compose -f dev/compose.yaml ps"

[tasks."db:logs"]
description = "Follow logs from the local Postgres"
run = "docker compose -f dev/compose.yaml logs --follow"

[tasks."db:psql"]
description = "Open psql against the local database"
run = "docker compose -f dev/compose.yaml exec postgres psql -U conclave -d conclave"
