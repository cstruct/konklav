name: konklav-dev

services:
  postgres:
    image: konklav-dev-postgres:18.6-jsonschema0.3.4
    build: postgres
    environment:
      POSTGRES_USER: konklav
      POSTGRES_PASSWORD: konklav
      POSTGRES_DB: konklav
    ports:
      - "${KONKLAV_DEV_PG_PORT:-15432}:5432"
    # Postgres 18 images keep data in a versioned directory below
    # /var/lib/postgresql, so the volume is mounted there instead of at
    # .../data. That also lets future major upgrades live side by side.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konklav -d konklav"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The rate-limit store for the relying SDK's tests. Rate-limit state
  # expires on its own, so nothing is persisted.
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${KONKLAV_DEV_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
